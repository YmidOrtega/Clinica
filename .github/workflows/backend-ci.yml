name: Backend CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'BackEnd-Clinica/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'BackEnd-Clinica/**'
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      e2e:
        description: Run the end-to-end suite against the Docker Compose stack
        type: boolean
        default: true

permissions:
  contents: read
  security-events: write
  actions: read

env:
  MAVEN_ARGS: -B -ntp

jobs:
  libraries:
    name: Shared libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Test and install in dependency order
        working-directory: BackEnd-Clinica/libs
        run: |
          for library in clinica-commons-web clinica-commons-openbao clinica-commons-security; do
            mvn install -f "$library/pom.xml"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: clinica-libraries
          path: ~/.m2/repository/com/ClinicaDeYmid/clinica-commons-*
          retention-days: 1

  services:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: libraries
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - patient-service
          - clinical-history-service
          - api-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - uses: actions/download-artifact@v4
        with:
          name: clinica-libraries
          path: ~/.m2/repository/com/ClinicaDeYmid

      - name: Unit and integration tests
        working-directory: BackEnd-Clinica/${{ matrix.service }}
        run: mvn verify

      - name: Coverage report
        working-directory: BackEnd-Clinica/${{ matrix.service }}
        run: mvn jacoco:report
        continue-on-error: true

      - uses: codecov/codecov-action@v4
        with:
          file: BackEnd-Clinica/${{ matrix.service }}/target/site/jacoco/jacoco.xml
          flags: ${{ matrix.service }}
          name: ${{ matrix.service }}-coverage
        continue-on-error: true

  legacy:
    name: ${{ matrix.service }} (pending refactor)
    runs-on: ubuntu-latest
    needs: libraries
    continue-on-error: ${{ matrix.service != 'eureka-service' }}
    strategy:
      fail-fast: false
      matrix:
        service:
          - eureka-service
          - suppliers-service
          - clients-service
          - admissions-service
          - ai-assistant-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - uses: actions/download-artifact@v4
        with:
          name: clinica-libraries
          path: ~/.m2/repository/com/ClinicaDeYmid

      - name: Build
        working-directory: BackEnd-Clinica/${{ matrix.service }}
        run: mvn package -DskipTests

  e2e:
    name: End-to-end suite
    runs-on: ubuntu-latest
    needs: services
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.e2e)
    timeout-minutes: 90
    env:
      COMPOSE_PROJECT: clinica-e2e
      PATIENT_DB_NAME: patient_db
      CLINICAL_DB_NAME: clinical_db
      AUTH_SERVICE_REPLICAS: 1
      PATIENT_SERVICE_REPLICAS: 1
      CLINICAL_SERVICE_REPLICAS: 1
      E2E_STATE_DIR: ${{ github.workspace }}/.e2e-state
    defaults:
      run:
        working-directory: BackEnd-Clinica
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/download-artifact@v4
        with:
          name: clinica-libraries
          path: ~/.m2/repository/com/ClinicaDeYmid

      - name: Package the services of the stack
        run: |
          for service in eureka-service auth-service patient-service clinical-history-service api-gateway; do
            mvn package -DskipTests -f "$service/pom.xml"
          done

      - name: Start the stack
        run: |
          docker compose -p "$COMPOSE_PROJECT" -f docker-compose.yml -f docker-compose.debug.yml \
            up -d --build api-gateway auth-service patient-service clinical-history-service kafka-connect-init mailpit
          for attempt in $(seq 1 120); do
            if [ -z "$(docker ps -q --filter health=starting --filter health=unhealthy)" ] \
                && curl -sf http://localhost:8080/actuator/health > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker ps --format '{{.Names}} {{.Status}}'
          exit 1

      - name: auth-service
        run: sh platform/e2e/auth-e2e.sh

      - name: Patients and clinical history
        run: sh platform/e2e/clinical-e2e.sh

      - name: OpenBao failover and isolation
        run: sh platform/e2e/openbao-e2e.sh

      - name: API gateway and clinical signing with step-up
        env:
          STEP_UP_MAX_AGE_SECONDS: 20
        run: |
          docker compose -p "$COMPOSE_PROJECT" -f docker-compose.yml -f docker-compose.debug.yml \
            up -d --no-deps --wait api-gateway clinical-history-service
          sh platform/e2e/gateway-e2e.sh

      - name: Collect logs
        if: failure()
        run: docker compose -p "$COMPOSE_PROJECT" -f docker-compose.yml -f docker-compose.debug.yml logs --no-color > "$RUNNER_TEMP/stack.log"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-stack-logs
          path: ${{ runner.temp }}/stack.log

      - name: Stop the stack
        if: always()
        run: docker compose -p "$COMPOSE_PROJECT" -f docker-compose.yml -f docker-compose.debug.yml down -v

  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    # Temporarily disabled - requires SonarCloud configuration
    if: false  # Enable when SONAR_TOKEN is configured
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build and analyze
        working-directory: BackEnd-Clinica
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn clean verify sonar:sonar \
            -Dsonar.projectKey=YmidOrtega_Clinica \
            -Dsonar.organization=ymidortega \
            -Dsonar.host.url=https://sonarcloud.io
        continue-on-error: true

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: services
    # Temporarily disabled - enable when Docker Hub credentials are configured
    if: false  # github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    strategy:
      matrix:
        service:
          - eureka-service
          - api-gateway
          - auth-service
          - patient-service
          - clinical-history-service
          - suppliers-service
          - clients-service
          - admissions-service
          - ai-assistant-service
          # - billing-service  # TODO: Uncomment when service is implemented
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/clinica-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./BackEnd-Clinica/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/clinica-${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/clinica-${{ matrix.service }}:buildcache,mode=max

  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    # Temporarily disabled - requires security-events: write permission
    if: false  # Enable when security permissions are properly configured
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './BackEnd-Clinica'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true
