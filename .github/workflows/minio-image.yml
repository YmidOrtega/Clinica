name: MinIO image

on:
  push:
    branches: [ main ]
    paths:
      - 'BackEnd-Clinica/platform/minio/**'
      - '.github/workflows/minio-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build MinIO from source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned release
        id: release
        run: echo "tag=$(sed -n 's/^ARG MINIO_TAG=//p' BackEnd-Clinica/platform/minio/Dockerfile | head -1)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: BackEnd-Clinica/platform/minio
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/ymidortega/clinica-minio:${{ steps.release.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
