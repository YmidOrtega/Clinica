server:
  port: 8761
  shutdown: graceful

spring:
  application:
    name: eureka-service
  config:
    import: optional:configtree:/run/secrets/
  security:
    user:
      name: ${eureka.username:${EUREKA_USERNAME:eureka}}
      password: ${eureka.password:${EUREKA_PASSWORD:}}
      roles: EUREKA_CLIENT

eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    enable-self-preservation: ${EUREKA_SELF_PRESERVATION:true}
    eviction-interval-timer-in-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: WARN
    com.netflix.eureka: INFO
    com.netflix.discovery: INFO
