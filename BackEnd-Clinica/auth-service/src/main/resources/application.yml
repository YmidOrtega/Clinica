server:
  port: ${AUTH_SERVICE_PORT:8086}
  shutdown: graceful
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 15m
      cookie:
        name: CLINICA_AUTH_SESSION
        http-only: true
        same-site: lax
        secure: ${AUTH_SESSION_COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: auth-service
  config:
    import: optional:configtree:/run/secrets/openbao/
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${AUTH_DB_URL:jdbc:mysql://localhost:3308/auth_db}
    username: ${AUTH_DB_APP_USER:auth_app}
    password: ${AUTH_DB_APP_PASSWORD:}
    hikari:
      pool-name: auth-service
      maximum-pool-size: ${AUTH_DB_POOL_SIZE:15}
      connection-timeout: 5000
  flyway:
    locations: classpath:db/migration/auth
    user: ${AUTH_DB_MIGRATOR_USER:auth_migrator}
    password: ${AUTH_DB_MIGRATOR_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
      org.hibernate.envers.default_catalog: auth_history
  cloud:
    vault:
      enabled: false
  session:
    timeout: 15m
    jdbc:
      table-name: auth_sessions.SPRING_SESSION
      initialize-schema: never
  mail:
    host: ${AUTH_MAIL_HOST:localhost}
    port: ${AUTH_MAIL_PORT:1025}

clinica:
  openbao:
    transit:
      mount: ${AUTH_TRANSIT_MOUNT:transit}
      key-refresh-interval: 5m
  auth:
    server:
      issuer: ${AUTH_ISSUER:http://localhost:8086}
      login-url: ${AUTH_LOGIN_URL:http://localhost:4321/login}
      home-url: ${AUTH_HOME_URL:http://localhost:4321/}
      session-absolute-lifetime: 12h
      tokens:
        access-token-ttl: 5m
        refresh-token-ttl: 12h
        authorization-code-ttl: 1m
        audience: clinica-api
        signing-key: ${AUTH_SIGNING_TRANSIT_KEY:auth-jwt}
        published-signing-key-versions: 2
      clients:
        api-gateway:
          grant-types: authorization_code, refresh_token
          redirect-uris: ${AUTH_GATEWAY_REDIRECT_URI:http://localhost:8080/login/oauth2/code/clinica}
          post-logout-redirect-uris: ${AUTH_GATEWAY_POST_LOGOUT_URI:http://localhost:8080/}
          scopes: openid, profile
          assertion-key: api-gateway-client
    frontend:
      activation-url: ${AUTH_ACTIVATION_URL:http://localhost:4321/activar-cuenta}
      password-reset-url: ${AUTH_PASSWORD_RESET_URL:http://localhost:4321/restablecer-contrasena}
    mail:
      from: ${AUTH_MAIL_FROM:no-responder@clinica.local}
    bootstrap:
      super-admin-email: ${AUTH_BOOTSTRAP_SUPER_ADMIN_EMAIL:}
    time-zone: America/Bogota
    password-deny-lists: classpath:passwords/ncsc-100k-common.txt
    password-service-words: clinica, clinicadeymid, ymid
    argon2:
      memory-kib: 19456
      iterations: 2
      parallelism: 1
    login-throttle:
      address-free-attempts: 5
      address-max-delay: 15m
      account-free-attempts: 10
      account-max-delay: 1m
      account-lock-threshold: 100
      retention: 30d

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "

---
spring:
  config:
    activate:
      on-profile: openbao
    import:
      - vault://secret/auth/db/migrator?prefix=auth.db.migrator.
      - vault://secret/auth/db/app?prefix=auth.db.app.
      - optional:vault://secret/auth/bootstrap?prefix=clinica.auth.bootstrap.
  cloud:
    vault:
      enabled: true
      uri: ${OPENBAO_ADDR:https://openbao:8200}
      authentication: APPROLE
      app-role:
        role-id: ${approle.role-id}
        secret-id: ${approle.secret-id}
      ssl:
        trust-store: file:/run/secrets/openbao-tls/ca.crt
        trust-store-type: PEM
  datasource:
    username: ${auth.db.app.username}
    password: ${auth.db.app.password}
  flyway:
    user: ${auth.db.migrator.username}
    password: ${auth.db.migrator.password}
