server:
  port: ${ADMISSIONS_SERVICE_PORT:8088}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: admissions-service
  config:
    import: optional:configtree:/run/secrets/openbao/
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${ADMISSIONS_DB_URL:jdbc:postgresql://localhost:5442/admissions_db}
    username: ${ADMISSIONS_DB_APP_USER:admissions_app}
    password: ${ADMISSIONS_DB_APP_PASSWORD:}
    hikari:
      pool-name: admissions-service
      maximum-pool-size: ${ADMISSIONS_DB_POOL_SIZE:15}
      connection-timeout: 5000
  flyway:
    locations: classpath:db/migration/admissions
    schemas: admissions
    default-schema: admissions
    user: ${ADMISSIONS_DB_MIGRATOR_USER:admissions_migrator}
    password: ${ADMISSIONS_DB_MIGRATOR_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: admissions
        jdbc:
          time_zone: UTC
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: admissions-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        allow.auto.create.topics: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  cloud:
    vault:
      enabled: false
    openfeign:
      client:
        config:
          patient-service:
            connect-timeout: 1000
            read-timeout: 3000
          contracting-service:
            connect-timeout: 1000
            read-timeout: 3000
          practitioners-service:
            connect-timeout: 1000
            read-timeout: 3000
    circuitbreaker:
      resilience4j:
        disable-time-limiter: true

clinica:
  admissions:
    time-zone: America/Bogota
    patient-events:
      enabled: ${ADMISSIONS_PATIENT_EVENTS_ENABLED:true}
    practitioner-events:
      enabled: ${ADMISSIONS_PRACTITIONER_EVENTS_ENABLED:true}
    clinical-events:
      enabled: ${ADMISSIONS_CLINICAL_EVENTS_ENABLED:true}
    seal:
      transit-key: ${ADMISSIONS_SEAL_TRANSIT_KEY:admissions-seal}
    receipts:
      public-checks-per-window: ${ADMISSIONS_PUBLIC_CHECKS_PER_WINDOW:600}
      public-window: ${ADMISSIONS_PUBLIC_CHECK_WINDOW:1m}
    coverage:
      ttl: ${ADMISSIONS_COVERAGE_TTL:10m}
      maximum-size: ${ADMISSIONS_COVERAGE_CACHE_SIZE:5000}
  security:
    jwt:
      jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8086/oauth2/jwks}
      issuer: ${AUTH_ISSUER:http://localhost:8080/auth}
      audiences: clinica-api, admissions-service
    client:
      id: admissions-service
      token-uri: ${AUTH_TOKEN_URI:http://localhost:8086/oauth2/token}
      assertion-key: ${ADMISSIONS_CLIENT_TRANSIT_KEY:admissions-service-client}
      audiences:
        patient-service: patient-service
        contracting-service: contracting-service
        practitioners-service: practitioners-service
    revocation:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}
    public-paths:
      - /actuator/health
      - /actuator/health/**
      - /actuator/info
      - /v3/api-docs/**
      - /swagger-ui/**
      - /swagger-ui.html
      - /api/v1/admissions/seal-keys
      - /api/v1/admissions/receipts/verification

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:false}

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "

---
spring:
  config:
    activate:
      on-profile: openbao
    import:
      - vault://secret/admissions/db/migrator?prefix=admissions.db.migrator.
      - vault://secret/admissions/db/app?prefix=admissions.db.app.
  cloud:
    vault:
      enabled: true
      uri: ${OPENBAO_ADDR:https://openbao:8200}
      authentication: APPROLE
      app-role:
        role-id: ${approle.role-id}
        secret-id: ${approle.secret-id}
      ssl:
        trust-store: file:/run/secrets/openbao-tls/ca.crt
        trust-store-type: PEM
  datasource:
    username: ${admissions.db.app.username}
    password: ${admissions.db.app.password}
  flyway:
    user: ${admissions.db.migrator.username}
    password: ${admissions.db.migrator.password}
