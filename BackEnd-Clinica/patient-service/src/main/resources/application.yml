server:
  port: ${PATIENT_SERVICE_PORT:8081}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: patient-service
  config:
    import: optional:configtree:/run/secrets/openbao/
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${PATIENT_DB_URL:jdbc:mysql://localhost:3307/patient_db}
    username: ${PATIENT_DB_APP_USER:patient_app}
    password: ${PATIENT_DB_APP_PASSWORD:}
    hikari:
      pool-name: patient-service
      maximum-pool-size: ${PATIENT_DB_POOL_SIZE:15}
      connection-timeout: 5000
  flyway:
    locations: classpath:db/migration/patient
    user: ${PATIENT_DB_MIGRATOR_USER:patient_migrator}
    password: ${PATIENT_DB_MIGRATOR_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  cloud:
    vault:
      enabled: false
    openfeign:
      client:
        config:
          clients-service:
            connect-timeout: 1000
            read-timeout: 2000
    circuitbreaker:
      resilience4j:
        disable-time-limiter: true

clinica:
  patient:
    time-zone: America/Bogota
    health-providers:
      fresh-ttl: 5m
      last-known-ttl: 24h
      maximum-size: 1000
  security:
    jwt:
      jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8086/oauth2/jwks}
      issuer: ${AUTH_ISSUER:http://localhost:8080/auth}
      audiences: clinica-api, patient-service
    revocation:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}

resilience4j:
  circuitbreaker:
    instances:
      clients-service:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 1500ms
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:false}

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "

---
spring:
  config:
    activate:
      on-profile: openbao
    import:
      - vault://secret/patient/db/migrator?prefix=patient.db.migrator.
      - vault://secret/patient/db/app?prefix=patient.db.app.
  cloud:
    vault:
      enabled: true
      uri: ${OPENBAO_ADDR:https://openbao:8200}
      authentication: APPROLE
      app-role:
        role-id: ${approle.role-id}
        secret-id: ${approle.secret-id}
      ssl:
        trust-store: file:/run/secrets/openbao-tls/ca.crt
        trust-store-type: PEM
  datasource:
    username: ${patient.db.app.username}
    password: ${patient.db.app.password}
  flyway:
    user: ${patient.db.migrator.username}
    password: ${patient.db.migrator.password}
