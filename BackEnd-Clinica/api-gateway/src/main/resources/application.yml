server:
  port: ${GATEWAY_PORT:8080}
  shutdown: graceful
  servlet:
    session:
      timeout: 15m
      cookie:
        name: CLINICA_SESSION
        http-only: true
        same-site: ${GATEWAY_SESSION_SAME_SITE:lax}
        secure: ${GATEWAY_SESSION_COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: api-gateway
  config:
    import: optional:configtree:/run/secrets/openbao/
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${GATEWAY_REDIS_HOST:localhost}
      port: ${GATEWAY_REDIS_PORT:6379}
      password: ${GATEWAY_REDIS_PASSWORD:}
      timeout: 1s
      connect-timeout: 1s
  session:
    timeout: 15m
    redis:
      namespace: clinica:gateway:session
      flush-mode: on-save
  cloud:
    vault:
      enabled: false
    gateway:
      server:
        webmvc:
          trusted-proxies: ${GATEWAY_TRUSTED_PROXIES:.*}
  http:
    client:
      connect-timeout: 2s
      read-timeout: 30s

clinica:
  openbao:
    transit:
      mount: ${GATEWAY_TRANSIT_MOUNT:transit}
      key-refresh-interval: 5m
  gateway:
    frontend:
      origins: ${GATEWAY_FRONTEND_ORIGINS:http://localhost:4321}
      home-url: ${GATEWAY_FRONTEND_HOME_URL:http://localhost:4321/}
    session:
      absolute-lifetime: 12h
    auth:
      public-url: ${AUTH_PUBLIC_URL:http://localhost:8080/auth}
      internal-url: ${AUTH_INTERNAL_URL:http://localhost:8086}
      client-id: api-gateway
      assertion-key: ${GATEWAY_CLIENT_TRANSIT_KEY:api-gateway-client}
      step-up-max-age: 5m
      refresh-before-expiry: 30s
    rate-limit:
      per-address: 1000
      per-user: 300
      window: 1m
    routes:
      auth-service: ${GATEWAY_AUTH_SERVICE_URI:lb://auth-service}
      patient-service: ${GATEWAY_PATIENT_SERVICE_URI:lb://patient-service}
      clinical-history-service: ${GATEWAY_CLINICAL_SERVICE_URI:lb://clinical-history-service}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}

---
spring:
  config:
    activate:
      on-profile: openbao
    import:
      - vault://secret/gateway/redis?prefix=gateway.redis.
  cloud:
    vault:
      enabled: true
      uri: ${OPENBAO_ADDR:https://openbao:8200}
      authentication: APPROLE
      app-role:
        role-id: ${approle.role-id}
        secret-id: ${approle.secret-id}
      ssl:
        trust-store: file:/run/secrets/openbao-tls/ca.crt
        trust-store-type: PEM
  data:
    redis:
      password: ${gateway.redis.password}
