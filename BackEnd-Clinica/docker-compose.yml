services:
   # Secretos

   openbao-bootstrap:
      build: ./platform/openbao
      image: clinica/openbao-tools:2.6.2
      container_name: openbao-bootstrap
      restart: "no"
      user: root
      entrypoint: ["sh", "/scripts/bootstrap.sh"]
      network_mode: none
      volumes:
         - ./platform/openbao/scripts:/scripts:ro
         - openbao_seal:/openbao/seal
         - openbao_tls:/openbao/tls
         - openbao_bootstrap:/openbao/bootstrap

   openbao-1: &openbao-node
      image: openbao/openbao:2.6.2
      container_name: openbao-1
      hostname: openbao-1
      restart: always
      command: ["server"]
      depends_on:
         openbao-bootstrap:
            condition: service_completed_successfully
      environment: &openbao-node-environment
         BAO_RAFT_NODE_ID: openbao-1
         BAO_API_ADDR: https://openbao-1:8200
         BAO_CLUSTER_ADDR: https://openbao-1:8201
         BAO_ADDR: https://127.0.0.1:8200
         BAO_CACERT: /openbao/tls/ca.crt
      volumes:
         - ./platform/openbao/openbao.hcl:/openbao/config/openbao.hcl:ro
         - openbao_tls:/openbao/tls:ro
         - openbao_seal:/openbao/seal:ro
         - openbao_1_data:/openbao/file
         - openbao_1_audit:/openbao/logs
      networks:
         secrets-net:
            aliases:
               - openbao
      healthcheck:
         test: ["CMD", "bao", "status"]
         interval: 10s
         timeout: 5s
         retries: 12
         start_period: 10s

   openbao-2:
      <<: *openbao-node
      container_name: openbao-2
      hostname: openbao-2
      environment:
         <<: *openbao-node-environment
         BAO_RAFT_NODE_ID: openbao-2
         BAO_API_ADDR: https://openbao-2:8200
         BAO_CLUSTER_ADDR: https://openbao-2:8201
      volumes:
         - ./platform/openbao/openbao.hcl:/openbao/config/openbao.hcl:ro
         - openbao_tls:/openbao/tls:ro
         - openbao_seal:/openbao/seal:ro
         - openbao_2_data:/openbao/file
         - openbao_2_audit:/openbao/logs

   openbao-3:
      <<: *openbao-node
      container_name: openbao-3
      hostname: openbao-3
      environment:
         <<: *openbao-node-environment
         BAO_RAFT_NODE_ID: openbao-3
         BAO_API_ADDR: https://openbao-3:8200
         BAO_CLUSTER_ADDR: https://openbao-3:8201
      volumes:
         - ./platform/openbao/openbao.hcl:/openbao/config/openbao.hcl:ro
         - openbao_tls:/openbao/tls:ro
         - openbao_seal:/openbao/seal:ro
         - openbao_3_data:/openbao/file
         - openbao_3_audit:/openbao/logs

   openbao-init:
      image: clinica/openbao-tools:2.6.2
      container_name: openbao-init
      restart: "no"
      user: root
      entrypoint: ["sh", "/scripts/configure.sh"]
      depends_on:
         openbao-1:
            condition: service_started
         openbao-2:
            condition: service_started
         openbao-3:
            condition: service_started
      volumes:
         - ./platform/openbao/scripts:/scripts:ro
         - ./platform/openbao/policies:/openbao/policies:ro
         - openbao_tls:/openbao/tls:ro
         - openbao_bootstrap:/openbao/bootstrap
         - openbao_approle_patient:/openbao/approle/patient-service
         - openbao_approle_clinical:/openbao/approle/clinical-history-service
         - openbao_approle_auth:/openbao/approle/auth-service
         - openbao_approle_agent:/openbao/approle/infra-agent
      networks:
         - secrets-net

   openbao-agent:
      image: clinica/openbao-tools:2.6.2
      container_name: openbao-agent
      restart: always
      command: ["agent", "-config=/openbao/config/agent.hcl"]
      depends_on:
         openbao-init:
            condition: service_completed_successfully
      volumes:
         - ./platform/openbao/agent.hcl:/openbao/config/agent.hcl:ro
         - openbao_tls:/openbao/tls:ro
         - openbao_approle_agent:/openbao/approle:ro
         - patient_db_secrets:/rendered/patient-db
         - clinical_db_secrets:/rendered/clinical-db
         - clinical_storage_secrets:/rendered/clinical-storage
         - kafka_connect_secrets:/rendered/kafka-connect
         - auth_db_secrets:/rendered/auth-db
      networks:
         - secrets-net
      healthcheck:
         test: ["CMD-SHELL", "for f in patient-db/debezium-password clinical-db/debezium-password clinical-storage/attachments-secret-key kafka-connect/clinical-db-debezium-password auth-db/app-password auth-db/debezium-password kafka-connect/auth-db-debezium-password; do test -s /rendered/$$f || exit 1; done"]
         interval: 5s
         timeout: 3s
         retries: 24

   # Bases de datos

   # Base de datos para pacientes
   patient-db:
      image: mysql:8.0
      container_name: patient-db
      restart: always
      depends_on:
         openbao-agent:
            condition: service_healthy
      environment:
         MYSQL_ROOT_PASSWORD_FILE: /run/secrets/patient-db/root-password
         MYSQL_DATABASE: ${PATIENT_DB_NAME}
         PATIENT_DB_MIGRATOR_USER_FILE: /run/secrets/patient-db/migrator-user
         PATIENT_DB_MIGRATOR_PASSWORD_FILE: /run/secrets/patient-db/migrator-password
         PATIENT_DB_APP_USER_FILE: /run/secrets/patient-db/app-user
         PATIENT_DB_APP_PASSWORD_FILE: /run/secrets/patient-db/app-password
         PATIENT_DB_DEBEZIUM_USER_FILE: /run/secrets/patient-db/debezium-user
         PATIENT_DB_DEBEZIUM_PASSWORD_FILE: /run/secrets/patient-db/debezium-password
      volumes:
         - patient_data:/var/lib/mysql
         - ./patient-service/docker/mysql-init:/docker-entrypoint-initdb.d:ro
         - patient_db_secrets:/run/secrets/patient-db:ro
      networks:
         - patient-data
      healthcheck:
         test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$(cat $$MYSQL_ROOT_PASSWORD_FILE)\" --silent"]
         interval: 10s
         timeout: 5s
         retries: 10

   clinical-db:
      build: ./clinical-history-service/docker/mysql
      container_name: clinical-db
      restart: always
      depends_on:
         openbao-agent:
            condition: service_healthy
      environment:
         MYSQL_ROOT_PASSWORD_FILE: /run/secrets/clinical-db/root-password
         MYSQL_DATABASE: ${CLINICAL_DB_NAME}
         CLINICAL_DB_MIGRATOR_USER_FILE: /run/secrets/clinical-db/migrator-user
         CLINICAL_DB_MIGRATOR_PASSWORD_FILE: /run/secrets/clinical-db/migrator-password
         CLINICAL_DB_APP_USER_FILE: /run/secrets/clinical-db/app-user
         CLINICAL_DB_APP_PASSWORD_FILE: /run/secrets/clinical-db/app-password
         CLINICAL_DB_DEBEZIUM_USER_FILE: /run/secrets/clinical-db/debezium-user
         CLINICAL_DB_DEBEZIUM_PASSWORD_FILE: /run/secrets/clinical-db/debezium-password
      volumes:
         - clinical_data:/var/lib/mysql
         - clinical_keyring:/var/lib/mysql-keyring
         - ./clinical-history-service/docker/mysql-init:/docker-entrypoint-initdb.d:ro
         - clinical_db_secrets:/run/secrets/clinical-db:ro
      networks:
         - clinical-data
      healthcheck:
         test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$(cat $$MYSQL_ROOT_PASSWORD_FILE)\" --silent"]
         interval: 10s
         timeout: 5s
         retries: 10

   clinical-storage:
      image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
      container_name: clinical-storage
      restart: always
      command: server /data --console-address ":9001"
      depends_on:
         openbao-agent:
            condition: service_healthy
      environment:
         MINIO_ROOT_USER_FILE: /run/secrets/clinical-storage/root-user
         MINIO_ROOT_PASSWORD_FILE: /run/secrets/clinical-storage/root-password
      volumes:
         - clinical_attachments:/data
         - clinical_storage_secrets:/run/secrets/clinical-storage:ro
      networks:
         - clinical-data
      healthcheck:
         test: ["CMD", "mc", "ready", "local"]
         interval: 10s
         timeout: 5s
         retries: 10

   clinical-storage-init:
      image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
      container_name: clinical-storage-init
      restart: "no"
      depends_on:
         clinical-storage:
            condition: service_healthy
      entrypoint: ["sh", "/init-storage.sh"]
      environment:
         MINIO_ROOT_USER_FILE: /run/secrets/clinical-storage/root-user
         MINIO_ROOT_PASSWORD_FILE: /run/secrets/clinical-storage/root-password
         CLINICAL_ATTACHMENTS_ACCESS_KEY_FILE: /run/secrets/clinical-storage/attachments-access-key
         CLINICAL_ATTACHMENTS_SECRET_KEY_FILE: /run/secrets/clinical-storage/attachments-secret-key
      volumes:
         - clinical_storage_secrets:/run/secrets/clinical-storage:ro
         - ./clinical-history-service/docker/storage-init/init-storage.sh:/init-storage.sh:ro
         - ./clinical-history-service/docker/storage-init/clinical-app-policy.json:/policies/clinical-app-policy.json:ro
      networks:
         - clinical-data

   # Base de datos para facturación
   billing-db:
      image: mysql:8.0
      container_name: billing-db
      restart: always
      environment:
         MYSQL_ROOT_PASSWORD: ${BILLING_DB_ROOT_PASSWORD}
         MYSQL_DATABASE: ${BILLING_DB_NAME}
         MYSQL_USER: ${BILLING_DB_USER}
         MYSQL_PASSWORD: ${BILLING_DB_PASSWORD}
      ports:
         - "3308:3306"
      volumes:
         - billing_data:/var/lib/mysql
      networks:
         - clinica-net
      healthcheck:
         test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
         timeout: 20s
         retries: 10
      command: --log-bin-trust-function-creators=1

   # Base de datos para admisiones
   admissions-db:
      image: postgres:16
      container_name: admissions-db
      restart: always
      environment:
         POSTGRES_DB: ${ADMISSIONS_DB_NAME}
         POSTGRES_USER: ${ADMISSIONS_DB_USER}
         POSTGRES_PASSWORD: ${ADMISSIONS_DB_PASSWORD}
      ports:
         - "3309:5432"
      volumes:
         - admissions_data:/var/lib/postgresql/data
      networks:
         - clinica-net
      healthcheck:
         test:
            [
               "CMD-SHELL",
               "pg_isready -U ${ADMISSIONS_DB_USER} -d ${ADMISSIONS_DB_NAME}",
            ]
         interval: 10s
         timeout: 5s
         retries: 5

   # Base de datos para API Gateway
   gateway-db:
      image: postgres:16
      container_name: gateway-db
      restart: always
      environment:
         POSTGRES_DB: ${GATEWAY_DB_NAME}
         POSTGRES_USER: ${GATEWAY_DB_USER}
         POSTGRES_PASSWORD: ${GATEWAY_DB_PASSWORD}
      ports:
         - "3314:5432"
      volumes:
         - gateway_data:/var/lib/postgresql/data
      networks:
         - clinica-net
      healthcheck:
         test:
           [
              "CMD-SHELL",
              "pg_isready -U ${GATEWAY_DB_USER} -d ${GATEWAY_DB_NAME}",
           ]
         interval: 10s
         timeout: 5s
         retries: 5

   # Base de datos para asistente de IA
   ai-assistant-db:
      image: postgres:16
      container_name: ai-assistant-db
      restart: always
      environment:
         POSTGRES_DB: ${AI_ASSISTANT_DB_NAME}
         POSTGRES_USER: ${AI_ASSISTANT_DB_USER}
         POSTGRES_PASSWORD: ${AI_ASSISTANT_DB_PASSWORD}
      ports:
         - "3310:5432"
      volumes:
         - ai_assistant_data:/var/lib/postgresql/data
      networks:
         - clinica-net
      healthcheck:
         test:
            [
               "CMD-SHELL",
               "pg_isready -U ${AI_ASSISTANT_DB_USER} -d ${AI_ASSISTANT_DB_NAME}",
            ]
         interval: 10s
         timeout: 5s
         retries: 5

   # Base de datos para proveedores
   suppliers-db:
      image: mysql:8.0
      container_name: suppliers-db
      restart: always
      environment:
         MYSQL_ROOT_PASSWORD: ${SUPPLIERS_DB_ROOT_PASSWORD}
         MYSQL_DATABASE: ${SUPPLIERS_DB_NAME}
         MYSQL_USER: ${SUPPLIERS_DB_USER}
         MYSQL_PASSWORD: ${SUPPLIERS_DB_PASSWORD}
      ports:
         - "3311:3306"
      volumes:
         - suppliers_data:/var/lib/mysql
      networks:
         - clinica-net
      healthcheck:
         test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
         timeout: 20s
         retries: 10
      command: --log-bin-trust-function-creators=1

   # Base de datos para autenticación
   auth-db:
      image: mysql:8.0
      container_name: auth-db
      restart: always
      depends_on:
         openbao-agent:
            condition: service_healthy
      environment:
         MYSQL_ROOT_PASSWORD_FILE: /run/secrets/auth-db/root-password
         MYSQL_DATABASE: ${AUTH_DB_NAME:-auth_db}
         AUTH_DB_MIGRATOR_USER_FILE: /run/secrets/auth-db/migrator-user
         AUTH_DB_MIGRATOR_PASSWORD_FILE: /run/secrets/auth-db/migrator-password
         AUTH_DB_APP_USER_FILE: /run/secrets/auth-db/app-user
         AUTH_DB_APP_PASSWORD_FILE: /run/secrets/auth-db/app-password
         AUTH_DB_DEBEZIUM_USER_FILE: /run/secrets/auth-db/debezium-user
         AUTH_DB_DEBEZIUM_PASSWORD_FILE: /run/secrets/auth-db/debezium-password
      volumes:
         - auth_data:/var/lib/mysql
         - ./auth-service/docker/mysql-init:/docker-entrypoint-initdb.d:ro
         - auth_db_secrets:/run/secrets/auth-db:ro
      networks:
         - auth-data
      healthcheck:
         test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$(cat $$MYSQL_ROOT_PASSWORD_FILE)\" --silent"]
         interval: 10s
         timeout: 5s
         retries: 10

   mailpit:
      image: axllent/mailpit:v1.31.1
      container_name: mailpit
      restart: always
      environment:
         MP_SMTP_AUTH_ACCEPT_ANY: "true"
         MP_SMTP_AUTH_ALLOW_INSECURE: "true"
         MP_MAX_MESSAGES: 5000
      networks:
         - mail-net

   # Base de datos para clientes
   clients-db:
      image: mysql:8.0
      container_name: clients-db
      restart: always
      environment:
         MYSQL_ROOT_PASSWORD: ${CLIENTS_DB_ROOT_PASSWORD}
         MYSQL_DATABASE: ${CLIENTS_DB_NAME}
         MYSQL_USER: ${CLIENTS_DB_USER}
         MYSQL_PASSWORD: ${CLIENTS_DB_PASSWORD}
      ports:
         - "3313:3306"
      volumes:
         - clients_data:/var/lib/mysql
      networks:
         - clinica-net
      healthcheck:
         test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
         timeout: 20s
         retries: 10
      command: --log-bin-trust-function-creators=1

   # Redis para caché
   redis-cache:
      image: redis:7-alpine
      container_name: redis-cache
      restart: always
      environment:
         - REDIS_PASSWORD=${REDIS_PASSWORD}
      command: sh -c 'redis-server --requirepass "$REDIS_PASSWORD" --maxmemory 256mb --maxmemory-policy allkeys-lru'
      ports:
         - "6379:6379"
      volumes:
         - redis_data:/data
      networks:
         - clinica-net
      healthcheck:
         test: ["CMD", "sh", "-c", "redis-cli -a $REDIS_PASSWORD ping"]
         interval: 30s
         timeout: 10s
         retries: 5
         start_period: 30s

   # Eureka Service Discovery
   eureka-service:
      build: ./eureka-service
      container_name: eureka-service
      restart: always
      environment:
         - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
         - EUREKA_CLIENT_FETCH_REGISTRY=false
         - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-service:8761/eureka/
         - EUREKA_INSTANCE_HOSTNAME=eureka-service
         - SPRING_PROFILES_ACTIVE=docker
      ports:
         - "8761:8761"
      networks:
         - clinica-net
      healthcheck:
         test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
         interval: 30s
         timeout: 10s
         retries: 5
         start_period: 60s

   # Plataforma de eventos
   kafka:
      image: apache/kafka:4.3.1
      container_name: kafka
      restart: always
      environment:
         CLUSTER_ID: ${KAFKA_CLUSTER_ID:-Q2xpbmljYUthZmthMDAwMQ}
         KAFKA_NODE_ID: 1
         KAFKA_PROCESS_ROLES: broker,controller
         KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
         KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
         KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
         KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
         KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
         KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
         KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
         KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
         KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
         KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
         KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
         KAFKA_LOG_DIRS: /var/lib/kafka/data
      volumes:
         - kafka_data:/var/lib/kafka/data
      networks:
         - kafka-net
      healthcheck:
         test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
         interval: 10s
         timeout: 10s
         retries: 10
         start_period: 20s

   kafka-connect:
      image: quay.io/debezium/connect:3.6.2.Final
      container_name: kafka-connect
      restart: always
      depends_on:
         kafka:
            condition: service_healthy
         openbao-agent:
            condition: service_healthy
      environment:
         BOOTSTRAP_SERVERS: kafka:9092
         GROUP_ID: clinica-connect
         CONFIG_STORAGE_TOPIC: connect.configs
         OFFSET_STORAGE_TOPIC: connect.offsets
         STATUS_STORAGE_TOPIC: connect.status
         CONFIG_STORAGE_REPLICATION_FACTOR: 1
         OFFSET_STORAGE_REPLICATION_FACTOR: 1
         STATUS_STORAGE_REPLICATION_FACTOR: 1
         CONNECT_CONFIG_PROVIDERS: env,dir
         CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
         CONNECT_CONFIG_PROVIDERS_DIR_CLASS: org.apache.kafka.common.config.provider.DirectoryConfigProvider
         KAFKA_REPLICATION_FACTOR: 1
         PATIENT_DB_HOST: patient-db
         CLINICAL_DB_HOST: clinical-db
         AUTH_DB_HOST: auth-db
      volumes:
         - kafka_connect_secrets:/run/secrets/kafka-connect:ro
      networks:
         - kafka-net
         - patient-data
         - clinical-data
         - auth-data
      healthcheck:
         test: ["CMD-SHELL", "curl -fs http://localhost:8083/connectors > /dev/null"]
         interval: 10s
         timeout: 5s
         retries: 12
         start_period: 30s

   kafka-connect-init:
      image: curlimages/curl:8.16.0
      container_name: kafka-connect-init
      restart: "no"
      depends_on:
         kafka-connect:
            condition: service_healthy
         patient-db:
            condition: service_healthy
         clinical-db:
            condition: service_healthy
         auth-db:
            condition: service_healthy
      entrypoint: ["sh", "/register-connectors.sh"]
      volumes:
         - ./platform/kafka-connect/register-connectors.sh:/register-connectors.sh:ro
         - ./patient-service/debezium:/connectors/patient-service:ro
         - ./clinical-history-service/debezium:/connectors/clinical-history-service:ro
         - ./auth-service/debezium:/connectors/auth-service:ro
      networks:
         - kafka-net

   #Servicios Spring Boot
   patient-service:
      build: ./patient-service
      restart: unless-stopped
      deploy:
         replicas: ${PATIENT_SERVICE_REPLICAS:-2}
      depends_on:
         patient-db:
            condition: service_healthy
         openbao-init:
            condition: service_completed_successfully
         eureka-service:
            condition: service_healthy
      environment:
         - SPRING_PROFILES_ACTIVE=openbao
         - PATIENT_DB_URL=jdbc:mysql://patient-db:3306/${PATIENT_DB_NAME}
         - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
         - EUREKA_URL=http://eureka-service:8761/eureka/
      volumes:
         - openbao_tls:/run/secrets/openbao-tls:ro
         - openbao_approle_patient:/run/secrets/openbao/approle:ro
      networks:
         - clinica-net
         - patient-data
         - secrets-net
      healthcheck:
         test: [ "CMD", "curl", "-fs", "http://localhost:8081/actuator/health/readiness" ]
         interval: 15s
         timeout: 5s
         retries: 5
         start_period: 60s

   clinical-history-service:
      build: ./clinical-history-service
      restart: unless-stopped
      deploy:
         replicas: ${CLINICAL_SERVICE_REPLICAS:-2}
      depends_on:
         clinical-db:
            condition: service_healthy
         clinical-storage-init:
            condition: service_completed_successfully
         openbao-init:
            condition: service_completed_successfully
         kafka:
            condition: service_healthy
         eureka-service:
            condition: service_healthy
      environment:
         - SPRING_PROFILES_ACTIVE=openbao
         - CLINICAL_DB_URL=jdbc:mysql://clinical-db:3306/${CLINICAL_DB_NAME}
         - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
         - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
         - EUREKA_URL=http://eureka-service:8761/eureka/
         - CLINICAL_ATTACHMENTS_ENDPOINT=http://clinical-storage:9000
      volumes:
         - openbao_tls:/run/secrets/openbao-tls:ro
         - openbao_approle_clinical:/run/secrets/openbao/approle:ro
      networks:
         - clinica-net
         - clinical-data
         - kafka-net
         - secrets-net
      healthcheck:
         test: [ "CMD", "curl", "-fs", "http://localhost:8089/actuator/health/readiness" ]
         interval: 15s
         timeout: 5s
         retries: 5
         start_period: 90s

