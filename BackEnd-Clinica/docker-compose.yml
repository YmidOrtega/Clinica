         suppliers-db:
            condition: service_healthy
         eureka-service:
            condition: service_healthy
         redis-cache:
            condition: service_healthy
      environment:
         - SPRING_DATASOURCE_URL=jdbc:mysql://suppliers-db:3306/${SUPPLIERS_DB_NAME}
         - SPRING_DATASOURCE_USERNAME=${SUPPLIERS_DB_USER}
