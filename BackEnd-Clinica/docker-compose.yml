   admissions-service:
      build: ./admissions-service
      container_name: admissions-service
      depends_on:
         admissions-db:
            condition: service_healthy
         eureka-service:
            condition: service_healthy
         redis-cache:
            condition: service_healthy
      environment:
         - SPRING_DATASOURCE_URL=jdbc:postgresql://admissions-db:5432/${ADMISSIONS_DB_NAME}
         - SPRING_DATASOURCE_USERNAME=${ADMISSIONS_DB_USER}
         - SPRING_DATASOURCE_PASSWORD=${ADMISSIONS_DB_PASSWORD}
         - SPRING_DATA_REDIS_HOST=redis-cache
         - SPRING_DATA_REDIS_PORT=6379
         - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
         - SPRING_DATA_REDIS_TIMEOUT=2000ms
         - SPRING_DATA_REDIS_LETTUCE_POOL_MAX_ACTIVE=8
         - SPRING_DATA_REDIS_LETTUCE_POOL_MAX_IDLE=8
         - SPRING_DATA_REDIS_LETTUCE_POOL_MIN_IDLE=0
         - JWT_SECRET=${JWT_SECRET}
         - JWT_EXPIRATION=${JWT_EXPIRATION}
         - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
         - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://eureka-service:8761/eureka/
         - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
         - SPRING_PROFILES_ACTIVE=docker
      ports:
         - "8083:8083"
      networks:
         - clinica-net
      healthcheck:
         test: [ "CMD", "curl", "-f", "http://localhost:8083/actuator/health" ]
         interval: 30s
         timeout: 10s
         retries: 5
         start_period: 90s

