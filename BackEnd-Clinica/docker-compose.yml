   # API Gateway
   api-gateway:
      build: ./api-gateway
      container_name: api-gateway
      depends_on:
         gateway-db:
            condition: service_healthy
         eureka-service:
            condition: service_healthy
         redis-cache:
            condition: service_healthy
         patient-service:
            condition: service_healthy
         #billing-service:
            #condition: service_healthy
         admissions-service:
            condition: service_healthy
         ai-assistant-service:
            condition: service_healthy
         suppliers-service:
            condition: service_healthy
         auth-service:
            condition: service_healthy
         clients-service:
            condition: service_healthy
      environment:
         - SPRING_DATASOURCE_URL=jdbc:postgresql://gateway-db:5432/${GATEWAY_DB_NAME}
         - SPRING_DATASOURCE_USERNAME=${GATEWAY_DB_USER}
         - SPRING_DATASOURCE_PASSWORD=${GATEWAY_DB_PASSWORD}
         - PATIENT_SERVICE_URL=http://patient-service:8081
         #- BILLING_SERVICE_URL=http://billing-service:8082
         - ADMISSIONS_SERVICE_URL=http://admissions-service:8083
         - AI_ASSISTANT_SERVICE_URL=http://ai-assistant-service:8084
         - SUPPLIERS_SERVICE_URL=http://suppliers-service:8085
         - AUTH_SERVICE_URL=http://auth-service:8086
         - CLIENTS_SERVICE_URL=http://clients-service:8087
         - SPRING_DATA_REDIS_HOST=redis-cache
         - SPRING_DATA_REDIS_PORT=6379
