   auth-service:
      build: ./auth-service
      restart: unless-stopped
      deploy:
         replicas: ${AUTH_SERVICE_REPLICAS:-2}
      depends_on:
         auth-db:
            condition: service_healthy
         mailpit:
            condition: service_started
         openbao-init:
            condition: service_completed_successfully
         eureka-service:
            condition: service_healthy
      environment:
         - SPRING_PROFILES_ACTIVE=openbao
         - AUTH_DB_URL=jdbc:mysql://auth-db:3306/${AUTH_DB_NAME:-auth_db}
         - EUREKA_URL=http://eureka-service:8761/eureka/
         - AUTH_ISSUER=${AUTH_ISSUER:-http://localhost:8080/auth}
         - AUTH_LOGIN_URL=${AUTH_LOGIN_URL:-http://localhost:8080/login}
         - AUTH_HOME_URL=${AUTH_HOME_URL:-http://localhost:8080/}
         - AUTH_ACTIVATION_URL=${AUTH_ACTIVATION_URL:-http://localhost:8080/activar-cuenta}
         - AUTH_PASSWORD_RESET_URL=${AUTH_PASSWORD_RESET_URL:-http://localhost:8080/restablecer-contrasena}
         - AUTH_GATEWAY_REDIRECT_URI=${AUTH_GATEWAY_REDIRECT_URI:-http://localhost:8080/login/oauth2/code/clinica}
         - AUTH_SESSION_COOKIE_SECURE=${AUTH_SESSION_COOKIE_SECURE:-false}
         - AUTH_MAIL_HOST=mailpit
         - AUTH_MAIL_PORT=1025
      volumes:
         - openbao_tls:/run/secrets/openbao-tls:ro
         - openbao_approle_auth:/run/secrets/openbao/approle:ro
      networks:
         - clinica-net
         - auth-data
         - secrets-net
         - mail-net
      healthcheck:
         test: [ "CMD", "curl", "-fs", "http://localhost:8086/actuator/health/readiness" ]
         interval: 15s
         timeout: 5s
         retries: 5
         start_period: 60s

