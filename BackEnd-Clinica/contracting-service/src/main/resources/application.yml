server:
  port: ${CONTRACTING_SERVICE_PORT:8087}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: contracting-service
  config:
    import: optional:configtree:/run/secrets/openbao/
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${CONTRACTING_DB_URL:jdbc:mysql://localhost:3311/contracting_db}
    username: ${CONTRACTING_DB_APP_USER:contracting_app}
    password: ${CONTRACTING_DB_APP_PASSWORD:}
    hikari:
      pool-name: contracting-service
      maximum-pool-size: ${CONTRACTING_DB_POOL_SIZE:15}
      connection-timeout: 5000
  flyway:
    locations: classpath:db/migration/contracting
    user: ${CONTRACTING_DB_MIGRATOR_USER:contracting_migrator}
    password: ${CONTRACTING_DB_MIGRATOR_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
      org.hibernate.envers.default_catalog: contracting_history
  cloud:
    vault:
      enabled: false
    openfeign:
      client:
        config:
          patient-service:
            connect-timeout: 1000
            read-timeout: 3000
    circuitbreaker:
      resilience4j:
        disable-time-limiter: true

clinica:
  contracting:
    time-zone: America/Bogota
    patient-directory:
      ttl: 24h
      maximum-size: 50000
  security:
    jwt:
      jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8086/oauth2/jwks}
      issuer: ${AUTH_ISSUER:http://localhost:8080/auth}
      audiences: clinica-api, contracting-service
    client:
      id: contracting-service
      token-uri: ${AUTH_TOKEN_URI:http://localhost:8086/oauth2/token}
      assertion-key: ${CONTRACTING_CLIENT_TRANSIT_KEY:contracting-service-client}
      audiences:
        patient-service: patient-service
    revocation:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}

resilience4j:
  circuitbreaker:
    instances:
      patient-service:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 2000ms
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:false}

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "

---
spring:
  config:
    activate:
      on-profile: openbao
    import:
      - vault://secret/contracting/db/migrator?prefix=contracting.db.migrator.
      - vault://secret/contracting/db/app?prefix=contracting.db.app.
  cloud:
    vault:
      enabled: true
      uri: ${OPENBAO_ADDR:https://openbao:8200}
      authentication: APPROLE
      app-role:
        role-id: ${approle.role-id}
        secret-id: ${approle.secret-id}
      ssl:
        trust-store: file:/run/secrets/openbao-tls/ca.crt
        trust-store-type: PEM
  datasource:
    username: ${contracting.db.app.username}
    password: ${contracting.db.app.password}
  flyway:
    user: ${contracting.db.migrator.username}
    password: ${contracting.db.migrator.password}
