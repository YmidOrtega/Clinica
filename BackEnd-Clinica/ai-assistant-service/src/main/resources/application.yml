server:
  port: ${AI_ASSISTANT_SERVICE_PORT:8084}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: ai-assistant-service
  config:
    import: optional:configtree:/run/secrets/openbao/
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${AI_ASSISTANT_DB_URL:jdbc:postgresql://localhost:3310/ai_assistant_db?currentSchema=assistant}
    username: ${AI_ASSISTANT_DB_APP_USER:ai_assistant_app}
    password: ${AI_ASSISTANT_DB_APP_PASSWORD:}
    hikari:
      pool-name: ai-assistant-service
      maximum-pool-size: ${AI_ASSISTANT_DB_POOL_SIZE:10}
      connection-timeout: 5000
  flyway:
    locations: classpath:db/migration/assistant
    schemas: assistant_migrations, assistant
    default-schema: assistant_migrations
    create-schemas: false
    user: ${AI_ASSISTANT_DB_MIGRATOR_USER:ai_assistant_migrator}
    password: ${AI_ASSISTANT_DB_MIGRATOR_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: assistant
        jdbc:
          time_zone: UTC
  cloud:
    vault:
      enabled: false

clinica:
  assistant:
    time-zone: America/Bogota
  security:
    jwt:
      jwk-set-uri: ${AUTH_JWKS_URI:http://localhost:8086/oauth2/jwks}
      issuer: ${AUTH_ISSUER:http://localhost:8080/auth}
      audiences: clinica-api, ai-assistant-service
    revocation:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:false}

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "

---
spring:
  config:
    activate:
      on-profile: openbao
    import:
      - vault://secret/assistant/db/migrator?prefix=assistant.db.migrator.
      - vault://secret/assistant/db/app?prefix=assistant.db.app.
  cloud:
    vault:
      enabled: true
      uri: ${OPENBAO_ADDR:https://openbao:8200}
      authentication: APPROLE
      app-role:
        role-id: ${approle.role-id}
        secret-id: ${approle.secret-id}
      ssl:
        trust-store: file:/run/secrets/openbao-tls/ca.crt
        trust-store-type: PEM
  datasource:
    username: ${assistant.db.app.username}
    password: ${assistant.db.app.password}
  flyway:
    user: ${assistant.db.migrator.username}
    password: ${assistant.db.migrator.password}
