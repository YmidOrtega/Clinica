services:
   openbao-1:
      ports:
         - "127.0.0.1:8200:8200"
      networks:
         - secrets-net
         - debug-net

   patient-db:
      ports:
         - "127.0.0.1:3307:3306"
      networks:
         - patient-data
         - debug-net

   patient-service:
      ports:
         - "127.0.0.1:8081-8082:8081"
      environment:
         - SWAGGER_UI_ENABLED=true

   kafka-connect:
      ports:
         - "127.0.0.1:8083:8083"
      networks:
         - kafka-net
         - patient-data
         - clinical-data
         - debug-net

   clinical-db:
      ports:
         - "127.0.0.1:3315:3306"
      networks:
         - clinical-data
         - debug-net

   clinical-storage:
      ports:
         - "127.0.0.1:9001:9001"
      networks:
         - clinical-data
         - debug-net

   contracting-service:
      ports:
         - "127.0.0.1:8087-8088:8087"
      environment:
         - SWAGGER_UI_ENABLED=true
         - CLINICA_SECURITY_STEPUP_MAXAGE=${STEP_UP_MAX_AGE_SECONDS:-300}s

   practitioners-service:
      ports:
         - "127.0.0.1:8085-8086:8085"
      environment:
         - SWAGGER_UI_ENABLED=true
         - CLINICA_SECURITY_STEPUP_MAXAGE=${STEP_UP_MAX_AGE_SECONDS:-300}s

   admissions-service:
      ports:
         - "127.0.0.1:8099-8100:8088"
      environment:
         - SWAGGER_UI_ENABLED=true
         - CLINICA_SECURITY_STEPUP_MAXAGE=${STEP_UP_MAX_AGE_SECONDS:-300}s

   billing-service:
      ports:
         - "127.0.0.1:8095-8096:8082"
      environment:
         - SWAGGER_UI_ENABLED=true
         - CLINICA_SECURITY_STEPUP_MAXAGE=${STEP_UP_MAX_AGE_SECONDS:-300}s
         - BILLING_DIAN_TEST_URL=http://dian-simulator:8080/WcfDianCustomerServices.svc
         - BILLING_DIAN_PRODUCTION_URL=http://dian-simulator:8080/WcfDianCustomerServices.svc
         - BILLING_DIAN_DELIVERY_DELAY=PT5S
         - BILLING_MINISTRY_VALIDATOR_URL=http://muv-simulator:8080

   dian-simulator:
      image: wiremock/wiremock:3.13.1
      container_name: dian-simulator
      command: ["--global-response-templating", "--disable-banner"]
      volumes:
         - ./platform/simulators/dian/mappings:/home/wiremock/mappings:ro
      ports:
         - "127.0.0.1:8097:8080"
      networks:
         - clinica-net
         - debug-net

   muv-simulator:
      image: wiremock/wiremock:3.13.1
      container_name: muv-simulator
      command: ["--global-response-templating", "--disable-banner"]
      volumes:
         - ./platform/simulators/muv/mappings:/home/wiremock/mappings:ro
      ports:
         - "127.0.0.1:8098:8080"
      networks:
         - clinica-net
         - debug-net

   clinical-history-service:
      ports:
         - "127.0.0.1:8091-8092:8089"
      environment:
         - SWAGGER_UI_ENABLED=true
         - CLINICA_SECURITY_STEPUP_MAXAGE=${STEP_UP_MAX_AGE_SECONDS:-300}s
         - CLINICA_CLINICAL_NOTES_MAXAUTHENTICATIONAGETOSIGN=${STEP_UP_MAX_AGE_SECONDS:-300}s

   api-gateway:
      environment:
         - CLINICA_GATEWAY_AUTH_STEPUPMAXAGE=${STEP_UP_MAX_AGE_SECONDS:-300}s

   kafka-ui:
      image: ghcr.io/kafbat/kafka-ui:v1.5.0
      container_name: kafka-ui
      depends_on:
         kafka:
            condition: service_healthy
      environment:
         KAFKA_CLUSTERS_0_NAME: clinica
         KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
         KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
         KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
      ports:
         - "127.0.0.1:8090:8080"
      networks:
         - kafka-net
         - debug-net


   auth-db:
      ports:
         - "127.0.0.1:3312:3306"
      networks:
         - auth-data
         - debug-net

   auth-service:
      ports:
         - "127.0.0.1:8093-8094:8086"

   mailpit:
      ports:
         - "127.0.0.1:8025:8025"
      networks:
         - mail-net
         - debug-net

networks:
   debug-net:
      driver: bridge
