services:
   openbao-1:
      ports:
         - "127.0.0.1:8200:8200"
      networks:
         - secrets-net
         - debug-net

   patient-db:
      ports:
         - "127.0.0.1:3307:3306"
      networks:
         - patient-data
         - debug-net

   patient-service:
      ports:
         - "127.0.0.1:8081-8082:8081"
      environment:
         - SWAGGER_UI_ENABLED=true

   kafka-connect:
      ports:
         - "127.0.0.1:8083:8083"
      networks:
         - kafka-net
         - patient-data
         - clinical-data
         - debug-net

   clinical-db:
      ports:
         - "127.0.0.1:3315:3306"
      networks:
         - clinical-data
         - debug-net

   clinical-storage:
      ports:
         - "127.0.0.1:9001:9001"
      networks:
         - clinical-data
         - debug-net

   clinical-history-service:
      ports:
         - "127.0.0.1:8091-8092:8089"
      environment:
         - SWAGGER_UI_ENABLED=true
         - CLINICA_SECURITY_STEPUP_MAXAGE=${STEP_UP_MAX_AGE_SECONDS:-300}s
         - CLINICA_CLINICAL_NOTES_MAXAUTHENTICATIONAGETOSIGN=${STEP_UP_MAX_AGE_SECONDS:-300}s

   api-gateway:
      environment:
         - CLINICA_GATEWAY_AUTH_STEPUPMAXAGE=${STEP_UP_MAX_AGE_SECONDS:-300}s

   kafka-ui:
      image: ghcr.io/kafbat/kafka-ui:v1.5.0
      container_name: kafka-ui
      depends_on:
         kafka:
            condition: service_healthy
      environment:
         KAFKA_CLUSTERS_0_NAME: clinica
         KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
         KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
         KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
      ports:
         - "127.0.0.1:8090:8080"
      networks:
         - kafka-net
         - debug-net


   auth-db:
      ports:
         - "127.0.0.1:3312:3306"
      networks:
         - auth-data
         - debug-net

   auth-service:
      ports:
         - "127.0.0.1:8093-8094:8086"

   mailpit:
      ports:
         - "127.0.0.1:8025:8025"
      networks:
         - mail-net
         - debug-net

networks:
   debug-net:
      driver: bridge
